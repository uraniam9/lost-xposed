blank_issues_enabled: true
contact_links:
  - name: A feature does nothing at all
    url: https://github.com/uraniam9/lost-xposed#scope-which-is-the-thing-that-will-bite-you
    about: >
      Check the app's "Required scope" section first. A feature whose process is
      not in scope installs nothing and reports nothing, which looks exactly like
      a feature that is broken.
  - name: What actually works yet
    url: https://github.com/uraniam9/lost-xposed#read-this-before-you-install-it
    about: >
      This is an alpha verified on one device and one framework. The app marks
      every feature working, partly tested or untested, and means it.
